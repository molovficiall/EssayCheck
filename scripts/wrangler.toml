name = "idek-shirts"
compatibility_date = "2025-10-01"
pages_build_output_dir = "public"

[vars]
SITE_URL = "https://idekshirts.com"          # CHANGE: your production origin, no trailing slash
CURRENCY = "usd"
SHIP_COUNTRIES = "US,CA,GB,AU,DE,FR,NL,SE"   # CSV of ISO country codes Stripe may ship to
AUTOMATIC_TAX = "false"                      # "true" once Stripe Tax is configured
ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"  # CHANGE

[[d1_databases]]
binding = "DB"
database_name = "idek-shirts"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "idek-shirts-media"
