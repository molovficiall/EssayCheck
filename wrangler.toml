name = "idek-shirts"
compatibility_date = "2025-04-08"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "idek-shirts"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "idek-shirts-media"

[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
SITE_URL = "https://idekshirts.example"
CURRENCY = "usd"
ALLOWED_SHIP_COUNTRIES = "US,CA"
AUTOMATIC_TAX = "false"
