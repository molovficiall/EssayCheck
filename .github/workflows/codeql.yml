name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@ce5e7eeac396d720fe2d802714996c8ce561e311
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311
