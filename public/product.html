<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F6F8" />
    <meta
      name="description"
      content="Product details and available sizes from Idek Shirts."
    />
    <meta property="og:type" content="product" />
    <link rel="canonical" href="https://idekshirts.example/product.html" />
    <link
      rel="icon"
      href="/assets/brand/favicon/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="alternate icon" href="/assets/brand/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/assets/brand/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/brand/favicon/site.webmanifest" />
    <link
      rel="preload"
      href="/assets/fonts/Archivo-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/IBMPlexSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <script>
      try {
        const t = localStorage.getItem('idek-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {}
    </script>
    <script type="module" src="/assets/js/theme.js"></script>
    <script type="module" src="/assets/js/cart.js"></script>
    <script type="module" src="/assets/js/product.js"></script>
    <title>Product — Idek Shirts</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Idek Shirts home"
        ><img
          class="logo-light"
          src="/assets/brand/logo-placeholder.svg"
          alt="Idek Shirts"
          width="160"
          height="40" /><img
          class="logo-dark"
          src="/assets/brand/logo-placeholder-dark.svg"
          alt=""
          width="160"
          height="40"
      /></a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="/">Shop</a><a href="/cart.html">Cart</a>
      </nav>
      <div class="header-actions">
        <button
          class="icon-button theme-toggle"
          type="button"
          aria-label="Switch theme"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4M12 8v8m-4-4h8"
            />
          </svg></button
        ><button
          class="button cart-trigger"
          type="button"
          data-cart-open
          aria-haspopup="dialog"
        >
          Cart <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </header>
    <dialog class="cart-drawer" data-cart-drawer aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">Your cart</h2>
        <button
          class="icon-button"
          type="button"
          data-cart-close
          aria-label="Close cart"
        >
          ×
        </button>
      </div>
      <div data-cart-lines class="cart-list"></div>
      <p class="notice" data-cart-message aria-live="polite"></p>
      <div class="cart-summary">
        <span>Subtotal</span><strong data-cart-subtotal>—</strong>
      </div>
      <button class="button button-primary" data-checkout type="button">
        Checkout</button
      ><a class="button-ghost" href="/cart.html">View full cart</a>
    </dialog>
    <main id="main" class="page-shell">
      <p class="notice" data-product-error role="status"></p>
      <section class="product-detail">
        <div>
          <div class="gallery-main">
            <img
              data-main-image
              alt=""
              width="900"
              height="900"
              fetchpriority="high"
            />
          </div>
          <div
            class="gallery-thumbs"
            data-thumbnails
            aria-label="Product images"
          ></div>
        </div>
        <div class="product-panel" data-product-panel></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-grid">
        <div>
          <a class="brand" href="/" aria-label="Idek Shirts home"
            ><img
              class="logo-light"
              src="/assets/brand/logo-placeholder.svg"
              alt="Idek Shirts"
              width="160"
              height="40" /><img
              class="logo-dark"
              src="/assets/brand/logo-placeholder-dark.svg"
              alt=""
              width="160"
              height="40"
          /></a>
        </div>
        <div>
          <h2>Information</h2>
          <nav class="footer-links">
            <a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a>
          </nav>
        </div>
        <div>
          <h2>Contact</h2>
          <a href="mailto:[CONTACT_EMAIL]">[CONTACT_EMAIL]</a>
        </div>
      </div>
      <div class="footer-bottom mono">© 2026 IDEK SHIRTS</div>
    </footer>
  </body>
</html>
