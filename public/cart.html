<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F6F8" />
    <meta name="description" content="Review your Idek Shirts cart." />
    <link rel="canonical" href="https://idekshirts.example/cart.html" />
    <link
      rel="icon"
      href="/assets/brand/favicon/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="alternate icon" href="/assets/brand/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/assets/brand/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/brand/favicon/site.webmanifest" />
    <link
      rel="preload"
      href="/assets/fonts/Archivo-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/IBMPlexSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <script>
      try {
        const t = localStorage.getItem('idek-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {}
    </script>
    <script type="module" src="/assets/js/theme.js"></script>
    <script type="module" src="/assets/js/cart.js"></script>
    <title>Your cart — Idek Shirts</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Idek Shirts home"
        ><img
          class="logo-light"
          src="/assets/brand/logo-placeholder.svg"
          alt="Idek Shirts"
          width="160"
          height="40" /><img
          class="logo-dark"
          src="/assets/brand/logo-placeholder-dark.svg"
          alt=""
          width="160"
          height="40"
      /></a>
      <nav class="header-nav">
        <a href="/">Shop</a><a href="/cart.html" aria-current="page">Cart</a>
      </nav>
      <div class="header-actions">
        <button
          class="icon-button theme-toggle"
          type="button"
          aria-label="Switch theme"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4M12 8v8m-4-4h8"
            />
          </svg></button
        ><span class="mono">Items <span data-cart-count>0</span></span>
      </div>
    </header>
    <main id="main" class="page-shell">
      <div class="page-title">
        <p class="eyebrow">Your selection</p>
        <h1>Cart</h1>
      </div>
      <section
        data-cart-lines
        class="cart-list"
        aria-label="Cart items"
      ></section>
      <p class="notice" data-cart-message aria-live="polite"></p>
      <div class="cart-summary">
        <span>Subtotal</span><strong data-cart-subtotal>—</strong>
      </div>
      <div class="cart-actions">
        <button class="button button-primary" data-checkout type="button">
          Proceed to checkout
        </button>
      </div>
      <p><a href="/">← Continue shopping</a></p>
    </main>
    <p class="sr-only" data-cart-live aria-live="polite"></p>
    <footer class="site-footer">
      <div class="footer-grid">
        <div><a href="/">Idek Shirts</a></div>
        <div>
          <h2>Information</h2>
          <nav class="footer-links">
            <a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a>
          </nav>
        </div>
        <div>
          <h2>Contact</h2>
          <a href="mailto:[CONTACT_EMAIL]">[CONTACT_EMAIL]</a>
        </div>
      </div>
      <div class="footer-bottom mono">© 2026 IDEK SHIRTS</div>
    </footer>
  </body>
</html>
