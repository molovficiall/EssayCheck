<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F6F8" />
    <meta name="description" content="Your checkout was canceled." />
    <link rel="canonical" href="https://idekshirts.example/cancel.html" />
    <link
      rel="icon"
      href="/assets/brand/favicon/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="alternate icon" href="/assets/brand/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/assets/brand/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/brand/favicon/site.webmanifest" />
    <link
      rel="preload"
      href="/assets/fonts/Archivo-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/IBMPlexSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <script>
      try {
        const t = localStorage.getItem('idek-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {}
    </script>
    <script type="module" src="/assets/js/theme.js"></script>
    <script type="module" src="/assets/js/cart.js"></script>
    <title>Checkout canceled — Idek Shirts</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a href="/" class="brand"
        ><img
          class="logo-light"
          src="/assets/brand/logo-placeholder.svg"
          alt="Idek Shirts"
          width="160"
          height="40" /><img
          class="logo-dark"
          src="/assets/brand/logo-placeholder-dark.svg"
          alt=""
          width="160"
          height="40"
      /></a>
      <nav class="header-nav">
        <a href="/">Shop</a><a href="/cart.html">Cart</a>
      </nav>
      <button
        class="icon-button theme-toggle"
        type="button"
        aria-label="Switch theme"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4M12 8v8m-4-4h8"
          />
        </svg>
      </button>
    </header>
    <main id="main" class="page-shell page-title">
      <p class="eyebrow">Checkout</p>
      <h1>Payment canceled</h1>
      <p>Your cart is unchanged. You can return when you're ready.</p>
      <a class="button button-primary" href="/cart.html">Return to cart</a>
    </main>
    <footer class="site-footer">
      <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
    </footer>
  </body>
</html>
